# Fufucode 开发环境蓝图（Devin repo blueprint / git-managed）
# Windows 平台块：.NET 10 SDK + NuGet 官方源，之后 dotnet build/test 开箱可用。
runs-on: windows
shell: powershell
initialize: |
  # .NET 10 SDK（net10.0 目标框架需要）装到 C:\dotnet，后续步骤经 $ENVRC 拿到 PATH
  Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:TEMP\dotnet-install.ps1"
  & "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "C:\dotnet"
  Add-Content -Path "$env:ENVRC" -Value 'PATH=/c/dotnet:$PATH'
maintenance: |
  # NuGet 官方源（本机默认无源）+ 还原全解决方案
  $has = & C:\dotnet\dotnet.exe nuget list source | Select-String -Quiet 'api.nuget.org'
  if (-not $has) { & C:\dotnet\dotnet.exe nuget add source https://api.nuget.org/v3/index.json -n nuget.org }
  & C:\dotnet\dotnet.exe restore Fufucode.sln
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
knowledge:
  - name: build
    contents: export PATH=/c/dotnet:$PATH && dotnet build Fufucode.sln
  - name: test
    contents: export PATH=/c/dotnet:$PATH && dotnet test Fufucode.sln
  - name: notes
    contents: PowerShell 5.1 下 fucode 的 *.ps1 脚本（feature-worktree/review-parallel/publish-local）含中文会解析失败，改用等价 git/dotnet 命令；fufu 桌面程序需自包含发布（机器未注册 dotnet 运行时路径）
