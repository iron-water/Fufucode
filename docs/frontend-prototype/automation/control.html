<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发工作台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="parallel.css"><script src="control-commands.js" defer></script><script src="control.js" defer></script></head>
<body><main>
<header><strong>开发工作台</strong><span id="connection" role="status">连接中</span><button id="refresh">刷新</button></header>
<section class="intro"><h1>工作包与决定</h1><p id="source" style="overflow-wrap:anywhere"></p><p id="mode"></p><small>批准、执行、接受与集成分别记录。阻塞或延后的成果可重新审核；半自动模式可批准部分返工，等待宿主按原会话接续。</small></section>
<nav><button id="create">新工作包</button><button id="manual">全人工</button><button id="semi">半自动</button></nav>
<p id="notice" role="status" aria-live="polite"></p>
<div class="workspace"><section id="graph" aria-label="工作包"></section><aside><h2>待你决定</h2><div id="inbox"></div></aside></div>
<details class="history"><summary>执行意图与关系</summary><pre id="intents"></pre></details>
<dialog id="editor"><form id="command-form"><h2 id="editor-title">记录决定</h2><p id="editor-note"></p><label>命令内容<textarea id="command-json" required rows="15" spellcheck="false"></textarea></label><p>保留命令ID及版本，Core会检查过期和重放。证据中的文本不作为命令执行。</p><footer><button type="button" id="close">取消</button><button type="submit" id="submit">记录</button></footer><p id="error" class="error" role="alert"></p></form></dialog>
<dialog id="detail"><button id="detail-close" class="top-close">关闭</button><h2>决定上下文</h2><pre id="context"></pre><button id="decide" hidden>准备决定</button></dialog>
</main></body></html>
