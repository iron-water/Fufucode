<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动开发 · 线程与任务层级图</title><link rel="icon" href="data:,"><link rel="stylesheet" href="automation.css"><script src="thread-flow-data.js" defer></script><script src="automation.js" defer></script><script src="live-console.js" defer></script></head>
<body><main class="feature-tab" aria-label="自动开发功能 tab">
<div class="tab-heading"><div><span class="eyebrow">功能区 / 自动开发</span><h1>线程与任务层级图</h1></div><span class="prototype">示例线程 / 任务 · 不代表实际派工</span><button id="theme" aria-label="切换深浅主题">◐</button></div>
<section class="live-toolbar" aria-label="真实开发控制"><strong id="source-status">正在检查本地工作流连接…</strong><div role="group" aria-label="开发模式"><button id="auto-mode" aria-pressed="true">自动模式</button><button id="manual-mode" aria-pressed="false">手动模式</button></div><button id="refresh-live">刷新真实状态</button><button id="pause-live">暂停派工与审核</button><button id="resume-live">恢复已批准流程</button><button id="edit-plan">编辑拓扑与模型</button></section>
<p id="mode-description" class="mode-description"></p>
<label class="flow-filter"><input id="show-inactive" type="checkbox" checked> 显示未运行流程（规划、等待、已完成）</label>
<div class="task-live-actions"><button id="revoke-task">撤销选中任务</button><button id="rebuild-task">重建选中任务</button><span id="task-command-status" role="status">修改产生新版本；旧工作树和交付历史保留。</span></div>
<div class="toolbar"><span class="graph-description">一个节点 = 一个对话线程 · 节点内多个任务</span><div class="playback"><button id="play" class="primary">▶ 播放部分打回</button><button id="step">下一事件</button><button id="reset">↺ 重置</button><label>速度 <select id="speed" aria-label="动画速度"><option value="1800">正常</option><option value="700">快速</option><option value="3500">慢速</option></select></label></div><div class="zoom"><button id="zoom-out" aria-label="缩小流程图">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="放大流程图">+</button><button id="fit">全图</button><button id="readable">阅读比例</button></div></div>
<div class="flow-caption"><span id="caption"></span><div class="legend"><span><i class="waiting"></i>等待</span><span><i class="running"></i>运行</span><span><i class="done"></i>完成</span><span><i class="rework"></i>打回 / 待核对</span></div></div>
<section id="viewport" aria-label="可缩放线程层级图"><div id="canvas-wrap"><div id="canvas"><div id="groups"></div><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div></div></section>
<div class="flow-status"><span id="current" role="status" aria-live="polite"></span><span id="counts"></span><span id="next"></span></div>
<section id="node-detail" aria-label="选中线程任务详情"><div class="detail-title"><span class="eyebrow">线程 / 任务 / 交付部分</span><h2 id="detail-title"></h2><span id="detail-state" class="pill"></span></div><div id="detail-body"></div></section>
<details class="event-drawer"><summary>事件与恢复 <span id="event-count"></span></summary><div class="recovery"><button id="replay">重放最近交付</button><button id="disconnect">模拟审核投递后断线</button><button id="restart">重启门房</button><button id="reconcile" disabled>核对已完成决定</button><span>演示不调用模型、不启动真实进程。</span></div><ol id="event-list"></ol></details>
</main><script src="compact-console.js"></script><script src="human-control.js"></script></body></html>
