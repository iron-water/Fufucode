<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发工作台 · 半自动控制</title><link rel="icon" href="data:,"><link rel="stylesheet" href="parallel.css"><script src="parallel.js" defer></script></head>
<body><main>
<header><strong>开发工作台</strong><select id="mode" aria-label="开发模式"><option value="manual">全人工 · 默认</option><option value="parallel">半自动 · 并行协调</option><option value="automatic">全自动 · 架构待定</option></select><span id="connection" role="status">连接中</span><a href="index.html">既有自动门控</a></header>
<section class="intro"><h1 id="mode-title">人类决定方向，工作台整理协作</h1><p id="mode-note"></p><small>本页已接入上层控制记录；模型派发、工作树和真实集成的底层接线尚未启用。</small></section>
<nav aria-label="工作包操作"><button id="new-package">＋ 工作包</button><button id="new-group">组织并行关系</button><button id="restructure">拆分 / 合并 / 转交</button><button id="knowledge">共享知识</button><label><input type="checkbox" id="show-history">显示历史工作包</label><span id="counts"></span></nav>
<p id="notice" role="status" aria-live="polite"></p>
<div class="workspace"><section id="graph" aria-label="线程与工作包关系图"></section><aside><h2>待你决定 <span id="inbox-count"></span></h2><div id="inbox"></div></aside></div>
<details class="history"><summary>控制记录与待执行操作</summary><div id="intents"></div><ol id="events"></ol></details>
</main>
<dialog id="package-dialog"><form id="package-form"><h2>新工作包</h2><label>ID<input name="id" required pattern="[A-Za-z0-9_\-]+" placeholder="settings"></label><label>标题<input name="title" required></label><label>目标<textarea name="goal" required></textarea></label><div class="pair"><label>Harness<input name="harness" value="codex" required></label><label>模型<input name="model" value="devin/swe-2" required></label></div><label>允许范围 · 每行一项<textarea name="scope" required placeholder="src/Features/Settings/**"></textarea></label><label>验收标准 · 每行一项<textarea name="acceptance" required></textarea></label><div class="pair"><label>成果<select name="artifact"><option value="code">代码实现</option><option value="evidence">测试 / 调查证据</option></select></label><label>依赖包 ID · 逗号分隔<input name="dependsOn"></label></div><label>依赖公共契约 ID · 逗号分隔<input name="knowledgeRefs"></label><footer><button type="button" class="close">取消</button><button type="submit">保存待批准工作包</button></footer><p class="error" role="alert"></p></form></dialog>
<dialog id="group-dialog"><form id="group-form"><h2>这些任务为什么并行？</h2><label>组 ID<input name="id" required></label><label>关系<select name="relation"><option value="independent">独立 · 分别验收</option><option value="competitive">竞争 · 同题择优</option><option value="complementary">互补 · 实现与证据汇总</option><option value="pipeline">流水 · 按成员顺序依赖</option></select></label><label>工作包 ID · 逗号分隔<input name="members" required></label><label>共同基线 · 竞争型必填<input name="baseline" placeholder="固定提交 SHA / 版本"></label><label>共同评价标准 · 竞争型必填<textarea name="criteria" placeholder="正确性
性能
维护成本"></textarea></label><p>先建立关系，再批准成员开工。竞争成果由你择优，其他方案保留。</p><footer><button type="button" class="close">取消</button><button type="submit">建立关系</button></footer><p class="error" role="alert"></p></form></dialog>
<dialog id="restructure-dialog"><form id="restructure-form"><h2>调整工作组织</h2><label>原工作包 ID · 逗号分隔<input name="sources" required></label><label>后继工作包 · 每行：新ID | 标题 | 目标<textarea name="replacements" required placeholder="combined | 联合修复 | 解决公共接口与调用方问题"></textarea></label><div class="pair"><label>后继 Harness<input name="harness" value="codex" required></label><label>后继模型<input name="model" value="devin/swe-2" required></label></div><p>后继继承所选包的范围、验收及外部依赖。旧历史保留；运行中的写入者须先停止。转交也产生新包，不改写原会话模型。</p><footer><button type="button" class="close">取消</button><button type="submit">提出重组方案</button></footer><p class="error" role="alert"></p></form></dialog>
<dialog id="detail-dialog"><button class="close top-close">关闭</button><div id="detail"></div></dialog>
<dialog id="knowledge-dialog"><form id="knowledge-form"><h2>公共知识</h2><div id="knowledge-list"></div><label>契约 / 事实 ID<input name="key" required></label><label>内容<textarea name="text" required></textarea></label><label>来源 / 证据<input name="source" required></label><p>保存为提案；批准后发布新版本，只通知声明依赖该契约的工作包。</p><footer><button type="button" class="close">关闭</button><button type="submit">提交发布决定</button></footer><p class="error" role="alert"></p></form></dialog>
<dialog id="decision-dialog"><form id="decision-form"><h2 id="decision-title"></h2><div id="decision-evidence"></div><label id="winner-label">选择方案<select name="winner"></select></label><label>决定<select name="choice"></select></label><label>理由 / 修复要求<textarea name="reason"></textarea></label><footer><button type="button" class="close">取消</button><button type="submit">确认决定</button></footer><p class="error" role="alert"></p></form></dialog>
</body></html>
