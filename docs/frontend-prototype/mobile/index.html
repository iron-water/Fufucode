<!DOCTYPE html>
<!-- Fufucode M0 手机原型：仅演示与夹具，不连接真实宿主。夹具数据见 js/fixtures.js，界面标记 data-fixture。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fufucode 手机原型（夹具）</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body data-screen="connect">

<div id="banner" class="banner banner-offline" hidden data-fixture>
  <span id="bannerText">连接已断开</span>
  <button id="bannerAction" type="button">重连</button>
</div>

<main id="screens">

  <!-- 连接 / 配对 -->
  <section class="screen" id="screen-connect" aria-label="连接设备">
    <header class="navbar"><h1>连接设备</h1></header>
    <div class="pane">
      <p class="hint">输入电脑桌面显示的 6 位配对码，仅局域网。</p>
      <label class="field">配对码
        <input id="pairCode" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 位数字" data-test="pair-code">
      </label>
      <p id="pairError" class="error" role="alert" hidden></p>
      <button id="btnConnect" class="primary" data-test="connect">连接</button>
      <div id="connStatus" class="conn-status" aria-live="polite"></div>
      <h2 class="sub">已配对设备</h2>
      <ul id="deviceList" class="list" data-test="device-list"></ul>
    </div>
  </section>

  <!-- 项目 / 会话列表 -->
  <section class="screen" id="screen-list" aria-label="会话列表">
    <header class="navbar">
      <button class="nav-back" data-nav="connect" aria-label="断开并返回">‹</button>
      <h1>会话</h1>
      <span id="hostStatus" class="pill" data-test="host-status">已连接</span>
    </header>
    <div class="pane">
      <h2 class="sub">项目</h2>
      <ul id="projectList" class="list" data-test="project-list"></ul>
      <h2 class="sub">会话</h2>
      <ul id="sessionList" class="list" data-test="session-list"></ul>
    </div>
  </section>

  <!-- 聊天 -->
  <section class="screen" id="screen-chat" aria-label="会话详情">
    <header class="navbar">
      <button class="nav-back" data-nav="list" aria-label="返回会话列表">‹</button>
      <h1 id="chatTitle">会话</h1>
      <span id="chatState" class="pill" data-test="chat-state">空闲</span>
    </header>
    <div id="timeline" class="timeline" data-test="timeline" aria-live="polite"></div>
    <div id="chips" class="chips" data-test="chips" hidden></div>
    <footer class="composer" id="composer">
      <button id="btnAttach" class="icon-btn" aria-label="添加附件" data-test="attach">＋</button>
      <textarea id="input" rows="1" placeholder="给 Agent 发消息" data-test="input"></textarea>
      <button id="btnSend" class="icon-btn primary-round" aria-label="发送" data-test="send">➤</button>
      <button id="btnStop" class="icon-btn danger-round" aria-label="停止" data-test="stop" hidden>■</button>
    </footer>
  </section>
</main>

<!-- 审批页 -->
<div id="approval" class="sheet" hidden role="dialog" aria-modal="true" aria-label="工具审批" data-test="approval">
  <div class="sheet-card">
    <h2 id="apprTitle">批准执行</h2>
    <p id="apprDetail" class="mono"></p>
    <div class="row">
      <button id="btnDeny" class="danger" data-test="deny">拒绝</button>
      <button id="btnApprove" class="primary" data-test="approve">允许一次</button>
    </div>
    <button id="btnAlways" class="text-btn" data-test="always">本会话总是允许</button>
  </div>
</div>

<!-- 附件动作页 -->
<div id="attachSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="添加附件" data-test="attach-sheet">
  <div class="sheet-card">
    <h2>添加附件</h2>
    <button class="sheet-item" data-att="photo">📷 照片 / 图库</button>
    <button class="sheet-item" data-att="file">📄 手机文件</button>
    <button class="sheet-item" data-att="library">📚 资料库引用</button>
    <button class="sheet-item" data-att="cancel">取消</button>
  </div>
</div>

<!-- 原型调试：模拟断线与宿主状态（真实产品由事件驱动） -->
<div id="simBar" class="sim-bar" data-fixture>
  <span class="sim-tag">原型夹具</span>
  <button data-sim="drop">模拟断线</button>
  <button data-sim="hostExit">宿主退出</button>
  <button data-sim="restore">恢复网络</button>
</div>

<script src="js/fixtures.js"></script>
<script src="js/app.js"></script>
</body>
</html>
